name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          plugin_marketplaces: https://github.com/prity27/claude_plugins.git
          plugins: sdei-review@sdei-tools

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the working rules in CLAUDE.md.
            Read CLAUDE.md first — it is the authority on this project's
            conventions, and several things that look like defects are recorded
            decisions.

            Focus, in priority order:

            1. **Security and authorization**
               - A write route (POST/PATCH/PUT/DELETE) merged without an auth
                 check is a BLOCKING defect, not a follow-up. Say so plainly.
               - Authorization belongs in services, in one reviewable place.
               - No secrets in the repo. `.env.example` must stay in sync with
                 the variables the code actually reads.

            2. **Layering** — `routes/ -> services/ -> models/`. A route handler
               that touches a Mongoose model directly is a defect.

            3. **Error handling** — services `throw AppError(status, code, message)`
               from `src/middleware/errorHandler.js`. A service that calls
               `res.status(...)` is a defect. Every error response must be
               `{ error: { code, message } }`, never a bare string.

            4. **Environment access** — `process.env` may be read ONLY in
               `src/config/env.js`. A read anywhere else is a defect: it
               bypasses boot-time validation and fails in production rather
               than at startup.

            5. **ESM correctness** — relative imports must carry the `.js`
               extension. Omitting it fails at runtime, not at lint, so lint
               will not catch it for you.

            6. **Client** — every network call goes through `src/lib/api.js`;
               no bare `fetch` in a component. Pages fetch data, components
               receive props.

            7. **Delivery process** — code for an epic whose story file is not
               `status: approved` should be flagged. An invented requirement is
               worse than a missing one; a gap belongs in
               `docs/knowledge/OPEN-QUESTIONS.md`, not in a reasonable default.

            DO NOT report these as defects — they are recorded decisions:
            - No test runner on the **client** (the server has one).
            - No migrations; Mongoose models are the only schema.
            - JavaScript rather than TypeScript.
            - The gate is currently red on `BE-01-02 AC-3` (a failed login is
              not logged with its source). That is an unmet acceptance
              criterion, not a broken harness. If this PR "fixes" it by
              weakening or deleting the test, flag that as a defect.

            Leave inline comments for specific issues. Use a top-level comment
            for the overall verdict. Be concrete: cite `file:line`. If the PR is
            clean, say so briefly rather than inventing findings.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
